name: validate entries
on:
  pull_request:
    paths: ["entries/**"]
  push:
    branches: [main]
    paths: ["entries/**", "scripts/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/validate_entries.py
